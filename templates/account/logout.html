{% extends 'base.html' %}

{% block title %}Logout - LittleLoop{% endblock %}

{% block content %}
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card mt-5">
                <div class="card-body p-5 text-center">
                    <i class="bi bi-box-arrow-right display-1 text-warning mb-4"></i>
                    <h2 class="mb-4">Sign Out?</h2>
                    <p class="text-muted mb-4">
                        Are you sure you want to sign out from LittleLoop?
                    </p>
                    
                    <form method="post" action="{% url 'account_logout' %}">
                        {% csrf_token %}
                        <button type="submit" class="btn btn-primary btn-lg w-100 mb-3">
                            <i class="bi bi-box-arrow-right"></i> Yes, Sign Out
                        </button>
                    </form>
                    
                    <a href="{% url 'home' %}" class="btn btn-outline-secondary w-100">
                        <i class="bi bi-arrow-left"></i> No, Take Me Back
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
